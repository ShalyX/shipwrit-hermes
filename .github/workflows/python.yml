name: Python checks
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit and negative tests
        run: python -m unittest discover -s tests -v
      - name: Compile the plugin
        run: python -m compileall -q __init__.py engine.py guard.py
